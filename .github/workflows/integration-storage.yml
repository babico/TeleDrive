name: CI 2 · Integration — REST, S3 & Databases

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: storage-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-api:
    name: Storage · REST / S3 / AWS CLI / rclone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install API and test runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx boto3
          python -m pip check
      - name: Compile API and storage
        run: python -m compileall -q teledrive web tests
      - name: Check browser API management scripts
        run: node --check web/static/app.js
      - name: Real SQL and HTTP contract tests with fake Telegram I/O
        run: |
          python -m pytest -q --durations=25 \
            tests/web/test_api_keys.py \
            tests/web/test_rest_api.py \
            tests/web/test_rest_transfer.py tests/storage/test_content_index.py tests/web/test_e2e_crypto.py tests/web/test_unified_service.py tests/web/test_auth_rbac.py \
            tests/storage/test_storage_engine.py \
            tests/storage/test_storage_user_mode.py \
            tests/storage/test_storage_recovery.py tests/storage/test_storage_rebuild.py tests/storage/test_telegram_inventory_reconcile.py \
            tests/storage/test_storage_pending_admin.py \
            tests/storage/test_storage_jobs.py \
            tests/storage/test_legacy_bridge.py \
            tests/storage/test_legacy_import_admin.py \
            tests/storage/test_metadata_backup.py \
            tests/storage/test_storage_sigkill.py \
            tests/storage/test_storage_multiworker.py \
            tests/storage/test_metadata_snapshot_rehearsal.py \
            tests/storage/test_storage_versions.py \
            tests/storage/test_storage_ops_health.py tests/meta/test_host_soak.py tests/meta/test_acceptance_cli.py \
            tests/storage/test_storage_gc_retention.py tests/storage/test_gc_reference_planner.py \
            tests/storage/test_storage_catalog.py \
            tests/storage/test_mtproto_rate_guard.py tests/storage/test_mtproto_multi_credentials.py \
            tests/storage/test_telegram_dr_rehearsal.py \
            tests/storage/test_legacy_cutover_acceptance.py \
            tests/s3/test_s3_contract.py \
            tests/s3/test_s3_permissions.py \
            tests/storage/test_storage_gc_audit.py \
            tests/storage/test_storage_gc_admin.py
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 02 · Integration | REST & S3' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | REST and SQL contracts with fake Telegram I/O |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  s3-protocol:
    name: S3 · versions, multipart, lifecycle & CLI clients
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install API and test runtime
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx boto3
          python -m pip check
      - name: Install actual AWS CLI and rclone clients
        run: |
          python -m pip install awscli
          # Pinned rclone: the compatibility contract is verified against
          # a known version, not whatever apt currently ships.
          curl -sSfL https://downloads.rclone.org/v1.66.0/rclone-v1.66.0-linux-amd64.zip -o /tmp/rclone.zip
          unzip -q /tmp/rclone.zip -d /tmp
          sudo install -m 0755 /tmp/rclone-v1.66.0-linux-amd64/rclone /usr/local/bin/rclone
          aws --version
          rclone version | head -1
      - name: Actual AWS CLI and rclone process integration
        env:
          TELEDRIVE_REQUIRE_CLI_CLIENTS: "1"
        run: python -m pytest -vv tests/s3/test_s3_cli_compat.py
      - name: S3 protocol and compatibility regression tests
        run: |
          python -m pytest -q --durations=25 \
            tests/s3/test_s3_version_reads.py tests/s3/test_s3_bucket_versioning.py tests/s3/test_s3_public_access_block.py tests/s3/test_s3_lifecycle.py \
            tests/s3/test_s3_delete_markers.py \
            tests/s3/test_s3_version_listing.py \
            tests/s3/test_s3_version_tagging.py \
            tests/s3/test_s3_version_copy.py \
            tests/s3/test_s3_vhost.py \
            tests/s3/test_s3_additional_checksums.py \
            tests/s3/test_s3_presigned_complete.py \
            tests/s3/test_s3_post_policy.py \
            tests/s3/test_s3_gateway.py tests/s3/test_s3_bucket_listing.py \
            tests/s3/test_s3_credentials.py \
            tests/s3/test_s3_admin.py \
            tests/s3/test_s3_multipart.py \
            tests/s3/test_s3_multipart_preconditions.py \
            tests/s3/test_s3_recovery.py \
            tests/s3/test_s3_presigned.py \
            tests/s3/test_s3_copy.py \
            tests/s3/test_s3_tagging.py \
            tests/s3/test_s3_batch_delete.py \
            tests/s3/test_s3_metadata.py \
            tests/s3/test_s3_bucket_location.py \
            tests/s3/test_s3_listing_v1.py \
            tests/s3/test_s3_conditions.py \
            tests/s3/test_s3_conditional_writes.py \
            tests/s3/test_s3_cors.py \
            tests/s3/test_s3_object_attributes.py \
            tests/s3/test_s3_sigv4_defense.py \
            tests/s3/test_s3_fail_closed.py tests/s3/test_s3_route_guard.py tests/s3/test_s3_unsupported_sweep.py tests/s3/test_s3_aws_chunked.py tests/s3/test_s3_rclone_compat.py tests/s3/test_s3_compat_reads.py tests/s3/test_s3_policy_status.py
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 02 · Integration | S3 Protocol' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | S3 protocol matrix; real AWS CLI and rclone processes |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # ---- merged from integration-databases.yml (CI 3 consolidation) ----
  database:
    name: Data · PostgreSQL / MySQL / restore
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: teledrive
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: teledrive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teledrive -d teledrive"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: teledrive
          MYSQL_USER: teledrive
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot-test-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_TEST_POSTGRES_URL: postgresql+psycopg://teledrive:test-password@127.0.0.1:5432/teledrive
      DB_TEST_MYSQL_URL: mysql+pymysql://teledrive:test-password@127.0.0.1:3306/teledrive
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application and DB drivers
        run: |
          python -m pip install -e .
          python -m pip install pytest "psycopg[binary]>=3.2,<4" "PyMySQL>=1.1,<2" "defusedxml==0.7.1" "cryptography>=50,<51"
          python -m pip check
      - name: Run live PostgreSQL/MySQL integration tests
        run: python -m pytest -vv tests/e2e/test_database_live.py tests/storage/test_storage_engine.py tests/storage/test_storage_recovery.py
      - name: Seed realistic metadata before native database backup
        run: |
          python scripts/ops/rehearse_native_database_restore.py seed --url-env DB_TEST_POSTGRES_URL --receipt "$RUNNER_TEMP/pg-dr.json" --source "$RUNNER_TEMP/pg-source.bin"
          python scripts/ops/rehearse_native_database_restore.py seed --url-env DB_TEST_MYSQL_URL --receipt "$RUNNER_TEMP/mysql-dr.json" --source "$RUNNER_TEMP/mysql-source.bin"
      - name: Native PostgreSQL 17 pg_dump and isolated pg_restore
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=test-password -v "$RUNNER_TEMP:/snap" postgres:17-alpine \
            pg_dump --host=127.0.0.1 --username=teledrive --dbname=teledrive --format=custom --file=/snap/pg-ci.backup --no-owner
          docker run --rm --network host -e PGPASSWORD=test-password postgres:17-alpine \
            psql --host=127.0.0.1 --username=teledrive --dbname=teledrive --set=ON_ERROR_STOP=1 \
            --command="CREATE DATABASE teledrive_dr_ci"
          docker run --rm --network host -e PGPASSWORD=test-password -v "$RUNNER_TEMP:/snap" postgres:17-alpine \
            pg_restore --host=127.0.0.1 --username=teledrive --dbname=teledrive_dr_ci --no-owner --no-privileges --exit-on-error /snap/pg-ci.backup
          python scripts/ops/rehearse_native_database_restore.py verify --url-env DB_TEST_POSTGRES_URL --restore-database teledrive_dr_ci --receipt "$RUNNER_TEMP/pg-dr.json"
      - name: Native MySQL 8.4 mysqldump and isolated restore
        run: |
          set -euo pipefail
          docker run --rm --network host -e MYSQL_PWD=test-password mysql:8.4 \
            mysqldump --host=127.0.0.1 --user=teledrive --single-transaction --quick --no-tablespaces --set-gtid-purged=OFF teledrive > "$RUNNER_TEMP/mysql-ci.sql"
          docker run --rm --network host -e MYSQL_PWD=root-test-password mysql:8.4 \
            mysql --host=127.0.0.1 --user=root --execute="CREATE DATABASE teledrive_dr_ci CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON teledrive_dr_ci.* TO 'teledrive'@'%';"
          docker run --rm --interactive --network host -e MYSQL_PWD=test-password mysql:8.4 \
            mysql --host=127.0.0.1 --user=teledrive --database=teledrive_dr_ci < "$RUNNER_TEMP/mysql-ci.sql"
          python scripts/ops/rehearse_native_database_restore.py verify --url-env DB_TEST_MYSQL_URL --restore-database teledrive_dr_ci --receipt "$RUNNER_TEMP/mysql-dr.json"
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 02 · Integration | Databases' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | Live PostgreSQL/MySQL and native restore rehearsals |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
