# TeleDrive — single container: WebUI :8080 + S3 :9000, one SQL catalog.
# Service settings live ONLY in config/config.yaml (config.example.yaml).
# The only environment inputs are below plus TZ / PUID / PGID.
#
# Local-only customizations (extra networks, extra caps) go in
# docker-compose.override.yml — that file is gitignored on purpose.
services:
  teledrive:
    build:
      context: .
      args:
        TELEDRIVE_DB_EXTRA_PACKAGES: ${TELEDRIVE_DB_EXTRA_PACKAGES:-}
    image: teledrive:local
    container_name: teledrive
    restart: unless-stopped
    # Run as the host uid/gid that OWNS ./config and ./data; the container
    # has no CAP_DAC_OVERRIDE (cap_drop below), so the owner must match.
    # Rootless Docker users: your login uid (usually 1000) is correct.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      # Service binds 0.0.0.0 inside; host side defaults to loopback.
      # TELEDRIVE_BIND_ADDRESS=0.0.0.0 exposes the LAN — trusted
      # networks only, or front it with a TLS reverse proxy.
      - "${TELEDRIVE_BIND_ADDRESS:-127.0.0.1}:${TELEDRIVE_WEB_PORT:-8080}:8080"
      - "${TELEDRIVE_BIND_ADDRESS:-127.0.0.1}:${TELEDRIVE_S3_PORT:-9000}:9000"
    environment:
      TELEDRIVE_CONFIG: /config/config.yaml
      TZ: ${TZ:-Europe/Istanbul}
    # Zombie reaper for the PID 1 python process.
    init: true
    # Clean shutdown budget: Telethon disconnects and the SQLite WAL
    # checkpoint need more than the default 10s before SIGKILL.
    stop_grace_period: 30s
    # Hardening: immutable root filesystem (tmpfs /tmp is the only
    # writable system path), zero Linux capabilities, no privilege
    # escalation, fork guard. The app needs none of them.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    volumes:
      - ./config:/config          # config.yaml (rw: first-boot writes it)
      - ./data:/data              # SQLite DB, auth, logs, scratch (rw)
      - ./uploads:/uploads:ro     # upload source root (read-only)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=5); urllib.request.urlopen('http://127.0.0.1:9000/__health', timeout=5)"]
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
