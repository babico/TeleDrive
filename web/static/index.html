<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeleDrive - Dashboard</title>
<script src="/static/vendor/tailwindcss.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
<script>
tailwind.config = {
  darkMode: 'class',
  theme: { extend: { colors: { brand: { 50:'#eef2ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',800:'#3730a3',900:'#312e81' } } } }
}
</script>
<style>
  [x-cloak]{display:none!important}
  .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:20px}
  .input{width:100%;background:#0f172a;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:8px 12px;font-size:14px}
  .input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid #374151;background:#1f2937;color:#e5e7eb;transition:all .15s}
  .btn:hover{background:#374151}
  .btn-primary{background:#4f46e5;border-color:#4f46e5;color:#fff}
  .btn-primary:hover{background:#4338ca}
  .btn-danger{background:#7f1d1d;border-color:#991b1b;color:#fecaca}
  .btn-danger:hover{background:#991b1b}
  .btn-ghost{background:transparent;border-color:transparent;color:#9ca3af}
  .btn-ghost:hover{background:#1f2937;color:#e5e7eb}
  .btn-sm{padding:4px 8px;font-size:12px}
  .badge{display:inline-block;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500}
  .badge-green{background:#064e3b;color:#6ee7b7}
  .badge-red{background:#7f1d1d;color:#fca5a5}
  .badge-gray{background:#374151;color:#9ca3af}
  .badge-blue{background:#1e3a8a;color:#93c5fd}
  .toast{position:fixed;right:16px;bottom:16px;padding:12px 16px;border-radius:10px;display:none;z-index:50;max-width:400px}
  .toast.show{display:block}
  .toast.bad{background:#7f1d1d;border:1px solid #991b1b;color:#fecaca}
  .toast.good{background:#064e3b;border:1px solid #065f46;color:#6ee7b7}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid #1f2937;font-size:13px}
  th{color:#9ca3af;font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
  .scroll{max-height:400px;overflow:auto}
  .tab{padding:8px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:#9ca3af;background:transparent;border:none}
  .tab:hover{color:#e5e7eb;background:#1f2937}
  .tab.active{color:#fff;background:#4f46e5}
  .page{display:none}.page.active{display:block}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:#9ca3af;margin-bottom:4px}
  .muted{color:#6b7280;font-size:13px}
  .section{margin-top:16px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row>*{flex:1}
  .row .btn{flex:0 0 auto}
  pre{white-space:pre-wrap;word-break:break-all;background:#0f172a;border:1px solid #1f2937;padding:12px;border-radius:8px;font-size:12px;max-height:300px;overflow:auto}
  h3{font-size:16px;font-weight:600;color:#f3f4f6;margin:0 0 4px}
  h4{font-size:13px;font-weight:600;color:#9ca3af;margin:16px 0 8px;text-transform:uppercase;letter-spacing:.05em}
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen" x-data="app()" x-init="init()">

<div id="authPrompt" class="prompt hidden fixed top-4 left-1/2 -translate-x-1/2 w-full max-w-lg bg-amber-900/80 border border-amber-700 p-4 rounded-xl z-40" :class="authPrompt?'show':''" x-show="authPrompt">
  <b x-text="authPrompt?authPrompt.kind+' for '+authPrompt.account:''"></b>
  <div class="row mt-2"><input x-model="authValue" class="input" autocomplete="one-time-code" placeholder="Enter code or password"><button class="btn btn-primary btn-sm" @click="submitAuth()">Submit</button></div>
</div>

<div id="toast" class="toast" :class="toastBad?'bad':'good'" x-show="toastMsg" x-text="toastMsg" x-transition></div>

<div class="flex h-screen overflow-hidden">
<aside class="w-56 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
  <div class="px-4 py-4 border-b border-gray-800 flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-brand-600 flex items-center justify-center font-bold text-sm">T</div>
    <span class="font-semibold text-lg">TeleDrive</span>
  </div>
  <nav class="flex-1 overflow-y-auto py-3 px-2 space-y-1">
        <a href="/dashboard" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors bg-brand-600 text-white">Dashboard</a>
    <a href="/queue" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">Queue</a>
    <a href="/history" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">History</a>
    <a href="/storage" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">Storage</a>
    <a href="/settings" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">Settings</a>
    <a href="/api-management" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">API Management</a>
    <a href="/s3" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">S3</a>
    <a href="/logs" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">Logs</a>
    <a href="/users" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-medium transition-colors text-gray-400 hover:text-gray-100 hover:bg-gray-800">Users</a>
  </nav>
  <div class="px-4 py-3 border-t border-gray-800 text-xs text-gray-500">TeleDrive</div>
</aside>

<div class="flex-1 flex flex-col overflow-hidden">
<header class="h-14 bg-gray-900/80 backdrop-blur border-b border-gray-800 flex items-center justify-between px-6 shrink-0">
  <div class="text-sm text-gray-400">Dashboard</div>
  <div class="flex items-center gap-3">
    <span class="text-sm text-gray-300" x-text="currentUser||''"></span>
    <span class="text-xs text-gray-500" x-text="currentRole"></span>
    <div class="w-8 h-8 rounded-full bg-brand-700 flex items-center justify-center text-xs font-bold" x-text="(currentUser||'A').charAt(0).toUpperCase()"></div>
    <button class="btn btn-sm btn-ghost" @click="logout()">Logout</button>
  </div>
</header>

<main class="flex-1 overflow-y-auto px-6 py-6">
<section class="space-y-4">
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
    <div class="card"><div class="muted text-xs uppercase">Pending jobs</div><div class="text-2xl font-bold mt-1" x-text="dashboard.pending||0"></div></div>
    <div class="card"><div class="muted text-xs uppercase">Failed jobs</div><div class="text-2xl font-bold mt-1" x-text="dashboard.failed||0"></div></div>
    <div class="card"><div class="muted text-xs uppercase">Uploaded</div><div class="text-2xl font-bold mt-1" x-text="dashboard.uploaded||0"></div></div>
    <div class="card"><div class="muted text-xs uppercase">Strategy</div><div class="text-2xl font-bold mt-1" x-text="dashboard.strategy||'-'"></div></div>
  </div>
  <div class="card">
    <h3>Quick actions</h3>
    <div class="row mt-3">
      <button class="btn btn-primary" @click="runJob()">Run next job</button>
      <button class="btn" @click="refreshDashboard()">Refresh</button>
    </div>
  </div>
</section>
</main>
</div>
</div>

<script src="/static/app.js"></script>
</body></html>
