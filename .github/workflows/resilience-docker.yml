name: CI 3 · Image & Resilience — build, scan, smoke, fault injection
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: teledrive-docker-fault-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Image · build, smoke and Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Docker build
        run: docker build --pull -t teledrive-security-ci .

      - name: Single-container Web UI and S3 gateway smoke
        shell: bash
        run: |
          set -euo pipefail
          set -euo pipefail
          mkdir -p /tmp/ci-config /tmp/ci-data
          chmod 700 /tmp/ci-config /tmp/ci-data
          cat > /tmp/ci-config/config.yaml <<'EOF'
          web:
            allowed_hosts: "localhost,127.0.0.1,[::1]"
          storage:
            channel: ""
            apis: []
          state:
            database_url: "sqlite:////data/state.db"
          EOF
          chmod 600 /tmp/ci-config/config.yaml
          cid="$(docker run -d --rm \
            --user "$(id -u):$(id -g)" \
            -v /tmp/ci-config:/config \
            -v /tmp/ci-data:/data \
            -p 127.0.0.1:18080:8080 \
            -p 127.0.0.1:19000:9000 \
            teledrive-security-ci)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS -u ci:ci-only-not-a-real-secret \
              http://127.0.0.1:18080/api/v1/admin/storage/health >/tmp/health.json \
              && curl -fsS -u ci:ci-only-not-a-real-secret \
              http://127.0.0.1:18080/api/v1/admin/storage/telegram-sessions >/tmp/sessions.json \
              && curl -fsS http://127.0.0.1:19000/__health >/tmp/s3-health.json; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then docker logs "$cid" | tail -60; exit 1; fi
          python - <<'PY'
          import json
          data = json.load(open("/tmp/health.json", encoding="utf-8"))
          assert "job_states" in data and "alerts" in data
          sessions = json.load(open("/tmp/sessions.json", encoding="utf-8"))
          assert "sessions" in sessions and "count" in sessions
          assert json.load(open("/tmp/s3-health.json", encoding="utf-8")) == {"ok": True}
          PY
          curl -fsS -u ci:ci-only-not-a-real-secret \
            http://127.0.0.1:18080/openapi.json >/tmp/openapi.json
          python - <<'PY'
          import json
          schema=json.load(open("/tmp/openapi.json",encoding="utf-8"))
          assert "/api/v1/auth/login" in schema["paths"]
          PY
          if curl -fsS http://127.0.0.1:18080/openapi.json >/dev/null; then
            echo "Anonymous Web API unexpectedly available" >&2
            exit 1
          fi
          if curl -fsS http://127.0.0.1:18080/__health >/dev/null; then
            echo "S3 listener accidentally accessible through Web port" >&2
            exit 1
          fi
          if curl -fsS http://127.0.0.1:19000/api/health >/dev/null; then
            echo "Web listener accidentally accessible through S3 port" >&2
            exit 1
          fi
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: teledrive-security-ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### CI 3 · Image — build, smoke, scan' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Image | teledrive:local |\n' >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '| Result | %s |\n' "${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  disposable-docker-fault-injection:
    name: Docker · 13 fault-injection checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version
      - name: Install two clean TeleDrive apps and inject recoverable faults
        env:
          TELEDRIVE_FAULT_REPORT_DIR: ${{ runner.temp }}/docker-fault-evidence
        run: bash scripts/dev/run_docker_fault_injection.sh
      - name: Publish sanitized acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: docker-fault-injection-report
          path: ${{ runner.temp }}/docker-fault-evidence/*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 03 · Resilience | Docker Fault Injection' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | Isolated 2-node API; PostgreSQL; crash, restore and teardown |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
