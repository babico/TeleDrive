<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Test</title>
<style>body{font-family:sans-serif;padding:20px}#err{color:red;font-weight:bold}</style>
</head><body>
<div id="err">No error</div>
<div id="out"></div>
<script>
window.onerror = function(msg, url, line, col, err){ document.getElementById('err').textContent = 'ERROR: '+msg+' at line '+line; return true; };
window.addEventListener('unhandledrejection', function(e){ document.getElementById('err').textContent = 'PROMISE ERROR: '+ (e.reason && e.reason.message ? e.reason.message : e.reason); });
</script>
<script src="http://192.168.21.2:8088/static/app.js"></script>
<script>
setTimeout(function(){
  var btn = document.getElementById('sendTgCode');
  document.getElementById('out').textContent = 'sendTgCode found: ' + (btn !== null) + ', onclick type: ' + (btn ? typeof btn.onclick : 'N/A');
  if(btn){ try { btn.click(); } catch(err){ document.getElementById('err').textContent = 'CLICK ERROR: '+err.message; } }
  setTimeout(function(){ document.getElementById('out').textContent += ' | done'; }, 2000);
}, 3000);
</script>
</body></html>
