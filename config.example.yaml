# TeleDrive configuration example (copy to config/config.yaml and edit).
#
# Settings live in SQL after the first start: this file SEEDS the database
# on first boot and stays as the bootstrap/disaster-recovery copy. From then
# on the SQL document (`service_settings`, encrypted with the S3 master key)
# is authoritative, so a UI save survives a rebuild from an older mounted
# file. If the SQL row is missing or cannot be decrypted (master-key change)
# the service falls back to this file and re-seeds on the next save.
#
# Deployment plumbing is NOT configured here and comes only from the
# container environment: TELEDRIVE_WEB_PORT, TELEDRIVE_S3_PORT,
# TELEDRIVE_BIND_ADDRESS, the per-listener TLS paths and
# TELEDRIVE_TRUSTED_PROXY (plus TZ, PUID/PGID and TELEDRIVE_CONFIG).
# Secrets in this file are encrypted at rest in SQL; never commit real
# values.

# ---------------------------------------------------------------------------
# Web service: authentication, listeners and request limits.
# ---------------------------------------------------------------------------
web:
  user: "admin"
  password: "CHANGE_ME_AT_LEAST_16_CHARACTERS"
  allowed_hosts: "localhost,127.0.0.1,[::1]"
  allow_insecure: false          # true only for explicitly trusted local setups
  rest_max_upload_bytes: 2147483648      # 2 GiB
  auth_failure_limit: 5
  auth_failure_window_seconds: 300
  # NOTE — listeners and TLS are NOT configured here. Ports, bind address
  # and certificates are ENV-ONLY deployment plumbing, set in the
  # docker-compose `environment:` block (or .env), because the same value
  # must drive the host port mapping, the in-container listener and the
  # healthcheck:
  #   TELEDRIVE_WEB_PORT / TELEDRIVE_S3_PORT   (e.g. 8088 / 9088)
  #   TELEDRIVE_BIND_ADDRESS                   (host-side mapping)
  #   TELEDRIVE_SSL_CERTFILE / TELEDRIVE_SSL_KEYFILE       (WebUI/REST)
  #   TELEDRIVE_S3_SSL_CERTFILE / TELEDRIVE_S3_SSL_KEYFILE (S3 gateway)
  #   TELEDRIVE_TRUSTED_PROXY=1                (TLS terminates in front)
  # A combined .pem (chain + private key) needs only the CERTFILE entry;
  # certificates live under ./config (e.g. /config/ssl/server.pem).
  # Read the admin password from a file instead of the plaintext field above:
  # password_file: "/config/web-password"
  # Maximum accepted HTTP request body size (32 MiB default):
  # max_request_bytes: 33554432
  # Directory for login session tokens (the Docker image sets this path):
  # auth_dir: "/data/auth"

# ---------------------------------------------------------------------------
# Unified storage: Telethon USER MTProto (the only live transport).
# Sessions are pre-authorized files; phone numbers and 2FA codes are never
# stored here (they are used once, interactively, by
# scripts/dev/create_storage_user_session.py).
# ---------------------------------------------------------------------------
storage:
  # Dedicated private broadcast channel the authorized user can post to.
  # Numeric private channel IDs must be visible in the user's dialogs.
  channel: "YOUR_PRIVATE_CHANNEL_ID_OR_USERNAME"

  # Credential rotation across the apis: list below:
  #   single       use only the first set
  #   round_robin  distribute sends across the sets in turn (default)
  #   failover     keep one set until a definite flood-wait rejection,
  #                then switch to the next with a fresh send intent
  #   parallel     upload chunks concurrently across all sets
  strategy: round_robin

  scratch_dir: "/data/tmp"
  # S3-listener TLS is ENV-ONLY (see the web section note above):
  #   TELEDRIVE_S3_SSL_CERTFILE / TELEDRIVE_S3_SSL_KEYFILE
  # A combined .pem works with just the CERTFILE variable. Certificates
  # belong under the ./config mount (e.g. /config/ssl/server.pem).

  # Persistent S3 credential-encryption master key file.
  s3_master_key_file: "/config/s3-master.key"

  # One or more Telegram API credential sets. Every set must resolve the
  # SAME dedicated channel above. account labels are optional and default
  # to mtproto-user, mtproto-user-2, ...
  apis:
    - api_id: 111111
      api_hash: "YOUR_TELEGRAM_API_HASH_1"
      session_file: "/config/mtproto-user.session"
      account: mtproto-user

    - api_id: 222222
      api_hash: "YOUR_TELEGRAM_API_HASH_2"
      session_file: "/config/mtproto-user-2.session"
      account: mtproto-user-2

# ---------------------------------------------------------------------------
# Durable local-file jobs and the opt-in lease-fenced legacy ingestion.
# ---------------------------------------------------------------------------
jobs:
  source_root: "/uploads"
  auto_run: true                 # process explicitly queued jobs
  # Optional folder auto-sync ("Dropbox-style"): periodically scan the
  # source root and enqueue new/changed files as durable upload jobs.
  # watch_bucket is required for watch to run; uploads still go through
  # the durable job scheduler with quota enforcement.
  watch: false
  watch_interval_seconds: 30     # minimum 5
  watch_bucket: ""               # e.g. "uploads"

# ---------------------------------------------------------------------------
# SQL state: the shared object catalog database.
# ---------------------------------------------------------------------------
state:
  database_url: "sqlite:////data/state.db"
  # Or any synchronous SQLAlchemy URL whose driver/dialect is installed:
  # database_url: "postgresql+psycopg://user:pass@db/teledrive"
  # database_url: "mysql+pymysql://user:pass@db/teledrive"

  # Optional DB drivers NOT bundled with the image (e.g. oracledb) are pip
  # installed into /data/site-packages at startup and added to sys.path:
  # db_extra_packages: ["oracledb"]

  allowed_sqlite_roots: "/data"

# ---------------------------------------------------------------------------
# Approved filesystem paths. source_roots is the approved upload-roots list
# for folder ingestion: only files under these paths can be queued as durable
# local-file upload jobs. The remaining keys constrain sessions, logs and the
# temporary split/lock directories.
# ---------------------------------------------------------------------------
paths:
  source_roots: "/uploads"
  session_roots: "/data/sessions"
  log_roots: "/data"
  split_dir: "/data/tmp"
  split_min_free_bytes: 536870912
  lock_dir: "/data/tmp"
