name: "Maintenance · archive and retire three stale branches"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/retire-legacy-branches-once.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    runs-on: ubuntu-latest
    if: github.repository == 'babico/TeleDrive' && github.ref == 'refs/heads/main'
    steps:
      - name: Archive exact audited heads and delete only those stale branch refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          while read -r branch expected tag; do
            [[ -n "$branch" ]] || continue
            ref="repos/${GH_REPO}/git/ref/heads/${branch}"
            if ! actual="$(gh api "$ref" --jq '.object.sha' 2>/dev/null)" || [[ "$actual" == "null" ]]; then
              archived="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
              [[ "$archived" == "null" ]] && archived=""
              if [[ "$archived" != "$expected" ]]; then
                echo "::error::${branch} is absent without its expected archive tag"; exit 1
              fi
              echo "${branch}: already retired and archived"
              continue
            fi
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::${branch} moved since audit (${actual}); refuse deletion"; exit 1
            fi
            protected="$(gh api "repos/${GH_REPO}/branches/${branch}" --jq '.protected')"
            if [[ "$protected" != "false" ]]; then
              echo "::error::${branch} is protected; refuse deletion"; exit 1
            fi
            open="$(gh pr list --repo "$GH_REPO" --state open --head "$branch" --json number --jq 'length')"
            if [[ "$open" != "0" ]]; then
              echo "::error::${branch} has an open PR; refuse deletion"; exit 1
            fi
            old_tag="$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null || true)"
            [[ "$old_tag" == "null" ]] && old_tag=""
            if [[ -n "$old_tag" && "$old_tag" != "$expected" ]]; then
              echo "::error::archive tag ${tag} points elsewhere"; exit 1
            fi
            if [[ -z "$old_tag" ]]; then
              gh api -X POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${expected}" >/dev/null
            fi
            [[ "$(gh api "repos/${GH_REPO}/git/ref/tags/${tag}" --jq '.object.sha')" == "$expected" ]]
            gh api -X DELETE "repos/${GH_REPO}/git/refs/heads/${branch}" >/dev/null
            if gh api "$ref" >/dev/null 2>&1; then
              echo "::error::${branch} survived deletion"; exit 1
            fi
            echo "${branch}: archived refs/tags/${tag} then deleted"
            echo "- ${branch} archived at ${expected} and branch removed" >> "$GITHUB_STEP_SUMMARY"
          done <<'BRANCHES'
          docs/fix-ci-matrix-count-20261023 38b46bf89c1a4f8e5489189af5115920a22ccd0e archive/2026-11-02/docs-fix-ci-matrix-count-20261023
          maintenance/2026-10-22-audit-ci-docs fdc066b56ebe3422d62ec8541e10c4ed4c90ef82 archive/2026-11-02/maintenance-2026-10-22-audit-ci-docs
          maintenance/2026-10-23-gc-security-doc-audit 56a7a1adbd0d3a604b7028e5a2058c8b97fc330a archive/2026-11-02/maintenance-2026-10-23-gc-security-doc-audit
          BRANCHES
