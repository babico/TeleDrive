[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-auto-upload"
version = "1.0.7"
description = "Safe, resumable Telegram file uploader for Windows and Linux"
requires-python = ">=3.11"
dependencies = [
  "Telethon>=1.36,<2",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  # Runtime, not optional: credential secrets are Fernet-encrypted and
  # SSE-C chunks are AES-256-GCM.  Omitting it here broke the live
  # workflows, which install with `pip install -e .` and never read
  # requirements.txt.
  "cryptography>=50,<51",
  "defusedxml==0.7.1",
]

[tool.setuptools.packages.find]
include = ["teledrive*"]

[tool.pytest.ini_options]
# -n auto uses every core with xdist when it is installed; without xdist
# pytest reports the unknown -n flag, so the default stays serial and the
# documented fast command is `pytest -n auto` (see CONTRIBUTING note in
# README). `--dist loadfile` keeps each test FILE on one worker, which is
# what the module-level fixtures and tmp databases expect.
addopts = "-p no:cacheprovider"
testpaths = ["tests"]
