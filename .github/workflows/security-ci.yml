name: Security CI

on:
  push:
    branches:
      - feature/docker-webui-multiaccount
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt
          python -m pip install pytest bandit pip-audit
      - name: Compile
        run: python -m compileall -q uploader.py db.py webapp.py tests
      - name: Unit tests
        run: python -m pytest -q
      - name: Dependency consistency
        run: python -m pip check
      - name: Bandit
        run: bandit -q -r uploader.py db.py webapp.py -ll
      - name: Dependency audit
        run: pip-audit -r requirements-web.txt
      - name: Docker build
        run: docker build --pull -t teledrive-security-ci .
