<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeleDrive - Login</title>
<script src="/static/vendor/tailwindcss.js"></script>
<script defer src="/static/vendor/alpine.min.js"></script>
<script>
tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 600:'#4f46e5',700:'#4338ca' } } } } }
</script>
<style>
  [x-cloak]{display:none!important}
  .input{width:100%;background:#0f172a;color:#e5e7eb;border:1px solid #374151;border-radius:8px;padding:10px 14px;font-size:14px}
  .input:focus{outline:none;border-color:#6366f1;box-shadow:0 0 0 2px rgba(99,102,241,.2)}
  .btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:#4f46e5;color:#fff;transition:all .15s}
  .btn:hover{background:#4338ca}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:32px}
</style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">

<div class="w-full max-w-sm" x-data="app()">
  <div class="text-center mb-8">
    <div class="w-14 h-14 rounded-2xl bg-brand-600 flex items-center justify-center font-bold text-2xl mx-auto mb-4">T</div>
    <h1 class="text-2xl font-bold">TeleDrive</h1>
    <p class="text-gray-400 text-sm mt-1">Sign in to continue</p>
  </div>
  <div class="card">
    <div class="mb-4">
      <label class="text-sm text-gray-400 mb-1 block">Username</label>
      <input x-model="loginUsername" class="input" placeholder="admin" @keyup.enter="login()">
    </div>
    <div class="mb-4">
      <label class="text-sm text-gray-400 mb-1 block">Password</label>
      <input x-model="loginPassword" class="input" type="password" placeholder="••••••••" @keyup.enter="login()">
    </div>
    <button class="btn w-full justify-center" @click="login()">Sign in</button>
    <p x-show="loginError" class="text-red-400 text-sm mt-3 text-center" x-text="loginError"></p>
    <p class="text-xs text-gray-500 mt-4 text-center">Default: admin / admin</p>
  </div>
</div>

<script src="/static/app.js"></script>
</body></html>
