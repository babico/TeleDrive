name: CI 1 · Quality — static analysis, security & unit tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Quality · static analysis, security audit, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx bandit pip-audit boto3
      - name: Compile
        run: python -m compileall -q teledrive web tests
      - name: Packaged import and entrypoint
        run: |
          python -m pip install --no-deps -e .
          python -c "import teledrive.db, teledrive.uploader; print('package-import-ok')"

      - name: Security and high-risk regression tests
        run: |
          python -m pytest -q --durations=25 \
            tests/meta/test_ci_workflows.py \
            tests/web/test_api_keys.py \
            tests/web/test_rest_api.py \
            tests/storage/test_storage_user_mode.py \
            tests/storage/test_mtproto_rate_guard.py \
            tests/storage/test_telegram_target_resolution.py \
            tests/storage/test_storage_recovery.py \
            tests/s3/test_s3_sigv4_defense.py \
            tests/s3/test_s3_fail_closed.py \
            tests/s3/test_s3_contract.py
      - name: Dependency consistency
        run: python -m pip check
      - name: S3 inventory bookkeeping is in sync with the manifest
        run: python scripts/ops/sync_s3_inventory.py --check
      - name: Bandit
        run: bandit -q -r teledrive web -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Docker Compose config
        run: |
          docker compose config --quiet
          
      - name: Publish CI run summary
        if: always()
        shell: bash
        run: |
          echo '### 01 · Quality | Security & Regression' >> "$GITHUB_STEP_SUMMARY"
          echo '| Detail | Value |' >> "$GITHUB_STEP_SUMMARY"
          echo '| --- | --- |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Scope | Offline regression; dependency and container security tests |' >> "$GITHUB_STEP_SUMMARY"
          echo '| Result | ${{ job.status }} |' >> "$GITHUB_STEP_SUMMARY"
          printf '| Ref | %s |\n' "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '| Commit | %s |\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

