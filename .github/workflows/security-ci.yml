name: Security CI

on:
  push:
    branches:
      - feature/docker-webui-multiaccount
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-web.txt
          python -m pip install pytest bandit pip-audit
      - name: Compile
        run: python -m compileall -q uploader.py db.py webapp.py tests
      - name: Unit tests
        run: pytest -q
      - name: Dependency consistency
        run: python -m pip check
      - name: Bandit
        run: bandit -q -r uploader.py db.py webapp.py -ll
      - name: Dependency audit
        run: pip-audit
      - name: Docker build
        run: docker build --pull -t teledrive-security-ci .
